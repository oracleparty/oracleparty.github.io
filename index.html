<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#F8F7F4">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Oracle Party</title>
  <script>(function(){var s=localStorage.getItem('oracle_party_theme');if(!s){s=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';localStorage.setItem('oracle_party_theme',s);}if(s!=='light'){document.documentElement.setAttribute('data-theme',s);var m={'dark':'#1A1A2E','oled':'#000000'};document.querySelector('meta[name="theme-color"]').content=m[s]||'#F8F7F4';}})();if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;0,9..144,900;1,9..144,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
  <link rel="stylesheet" href="css/style.css?v=20260404">
</head>
<body style="opacity:0">

  <!-- ===== SPLASH SCREEN ===== -->
  <div id="splash" class="screen active" style="display: flex;">
    <!-- Particle container — populated by JS -->
    <div class="splash__particles" id="splash-particles"></div>

    <!-- Glyph ring — authentic Egyptian hieroglyphs (Gardiner sign list) -->
    <div class="splash__ring">
      <span class="splash__glyph" style="--i:0">𓋹</span>
      <span class="splash__glyph" style="--i:1">𓂀</span>
      <span class="splash__glyph" style="--i:2">𓅃</span>
      <span class="splash__glyph" style="--i:3">𓏞</span>
      <span class="splash__glyph" style="--i:4">𓀭</span>
      <span class="splash__glyph" style="--i:5">𓇳</span>
      <span class="splash__glyph" style="--i:6">𓇯</span>
      <span class="splash__glyph" style="--i:7">𓊝</span>
      <span class="splash__glyph" style="--i:8">𓃗</span>
      <span class="splash__glyph" style="--i:9">𓋍</span>
      <span class="splash__glyph" style="--i:10">𓁹</span>
      <span class="splash__glyph" style="--i:11">𓆣</span>
    </div>

    <!-- Title reveal -->
    <h1 class="splash__title">Oracle Party</h1>

    <!-- Loading dots -->
    <div class="splash__loader">
      <div class="loading-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>

  <!-- ===== HOME SCREEN ===== -->
  <div id="home" class="screen home" style="display: none;">
    <button id="home-avatar" class="home-avatar" aria-label="Profile"></button>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"></button>
    <a href="#" id="home-signin" class="home-signin-link hidden">Sign In</a>
    <div id="home-toast" class="home-toast hidden"></div>
    <div class="home__crystal">🔮</div>
    <h1 class="home__brand">Oracle Party</h1>
    <p class="home__tagline" style="display:none"></p>
    <div class="home__actions">
      <button class="btn btn-primary btn-block" id="btn-host">Host Game</button>
      <button class="btn btn-secondary btn-block" id="btn-join">Join Game</button>
      <button class="btn-tertiary" id="btn-leaderboard">Leaderboards</button>
    </div>
  </div>

  <!-- ===== DISPLAY NAME MODAL ===== -->
  <div id="display-name-modal" class="modal-overlay">
    <div class="modal">
      <h2 class="modal__title">Who Goes There?</h2>
      <input
        type="text"
        id="display-name-input"
        class="input"
        placeholder="Enter your name"
        aria-label="Display name"
        maxlength="20"
        autocomplete="off"
        spellcheck="false"
      >
      <p id="display-name-error" style="color: var(--color-danger); font-size: var(--text-sm); margin-top: var(--space-sm); min-height: 1.2em;"></p>
      <button class="btn btn-primary btn-block" id="display-name-submit" style="margin-top: var(--space-lg);">Continue</button>
    </div>
  </div>

  <!-- ===== SCRIPTS ===== -->
  <script type="module">
    import { $, transitionScreens, delay, renderAvatar, navigateWithFade } from './js/utils.js';
    import { testConnection, fetchPendingRequests, cleanupOrphanedRooms } from './js/supabase.js';
    import { ensureDisplayName, initAuth, getCurrentUser, getDisplayName, showSignInModal, showSignUpModal } from './js/auth.js';
    import { updatePresence } from './js/presence.js';
    import { initThemeToggle } from './js/theme.js';

    // --- Init: Splash → Home ---
    async function init() {
      document.body.style.opacity = '1';
      const splash = $('#splash');
      const home = $('#home');

      // Spawn golden dust particles
      const particleContainer = document.getElementById('splash-particles');
      for (let i = 0; i < 20; i++) {
        const p = document.createElement('span');
        p.className = 'splash__particle';
        p.style.left = `${10 + Math.random() * 80}%`;
        p.style.animationDelay = `${Math.random() * 2.5}s`;
        p.style.animationDuration = `${2 + Math.random() * 2}s`;
        p.style.setProperty('--drift', `${(Math.random() - 0.5) * 40}px`);
        particleContainer.appendChild(p);
      }

      // Spin the glyph ring via JS (CSS can't reliably compose two transform animations)
      const ring = document.querySelector('.splash__ring');
      let ringAngle = 0;
      let ringLast = performance.now();
      function spinRing(now) {
        const dt = (now - ringLast) / 1000;
        ringLast = now;
        ringAngle += dt * 18; // 18°/s ≈ 20s per full revolution
        ring.style.transform = `translate(-50%, -50%) rotate(${ringAngle}deg)`;
        if (!splash.classList.contains('splash--exiting')) {
          requestAnimationFrame(spinRing);
        }
      }
      // Start spinning after the enter animation finishes
      ring.addEventListener('animationend', () => {
        ring.style.animation = 'none'; // remove fill-forward so JS can control transform
        ring.style.opacity = '1';
        requestAnimationFrame(spinRing);
      });

      // Run both in parallel: minimum splash time + Supabase connection test
      const [, connected] = await Promise.all([
        delay(3000),
        testConnection(),
        initAuth()
      ]);

      if (!connected) {
        console.warn('[Oracle Party] Supabase connection issue — proceeding anyway.');
      }

      // Render home avatar
      const homeAvatar = $('#home-avatar');
      const authUser = getCurrentUser();
      const name = getDisplayName() || '?';
      if (authUser?.profile) {
        homeAvatar.innerHTML = renderAvatar({
          displayName: authUser.profile.display_name,
          avatarColor: authUser.profile.avatar_color,
          avatarEmoji: authUser.profile.avatar_emoji
        });
      } else {
        homeAvatar.innerHTML = renderAvatar({ displayName: name, avatarColor: null, avatarEmoji: null });
        // Show sign-in link for guests
        $('#home-signin').classList.remove('hidden');
      }

      // Theme toggle
      initThemeToggle();

      // Track presence as "home"
      updatePresence({ activity: 'home' });

      // Clean up ghost rooms (fire-and-forget, non-blocking)
      cleanupOrphanedRooms().catch(() => {});

      // Converge elements before fade-out for cinematic exit
      splash.classList.add('splash--exiting');
      await delay(400);
      await transitionScreens(splash, home);

      // Friend request notifications (after home is visible so toast is seen)
      if (authUser) {
        fetchPendingRequests(authUser.user.id).then(pending => {
          if (pending.length > 0) {
            // Toast
            const toast = $('#home-toast');
            toast.textContent = `You have ${pending.length} friend request${pending.length > 1 ? 's' : ''}`;
            toast.classList.remove('hidden');
            toast.style.cursor = 'pointer';
            toast.onclick = () => { window.location.href = 'profile.html?tab=friends'; };
            setTimeout(() => toast.classList.add('hidden'), 4000);
            // Badge on avatar
            const badge = document.createElement('span');
            badge.className = 'home-avatar__badge';
            badge.textContent = pending.length;
            homeAvatar.appendChild(badge);
          }
        });
      }

      // 3-game signup nudge (guests only — rotating perks)
      if (!authUser) {
        const gamesPlayed = parseInt(localStorage.getItem('oracle_party_guest_games') || '0');
        if (gamesPlayed >= 3 && !localStorage.getItem('oracle_party_3game_nudge_dismissed')) {
          const homePerks = [
            'Unlock OLED Black mode and more themes.',
            'Save your stats and earn Oracle titles.',
            'Add friends and see who\u2019s online.',
            'Track your mastery across thousands of questions.',
            'Customize your avatar with colors and emoji.',
            'Compete on leaderboards.',
            `You\u2019ve played ${gamesPlayed} games \u2014 claim your Oracle identity!`
          ];
          const lastPerk = sessionStorage.getItem('oracle_party_last_nudge_perk') || '';
          const pool = homePerks.filter(p => p !== lastPerk);
          const perkText = pool[Math.floor(Math.random() * pool.length)];
          sessionStorage.setItem('oracle_party_last_nudge_perk', perkText);

          const nudge = document.createElement('div');
          nudge.className = 'signup-nudge signup-nudge--home';
          nudge.innerHTML = `
            <p class="signup-nudge__text">${perkText}</p>
            <button class="btn btn-primary" id="home-nudge-signup">Sign Up</button>
            <button class="signup-nudge__dismiss" id="home-nudge-dismiss">&times;</button>
          `;
          home.querySelector('.home__actions').before(nudge);
          $('#home-nudge-signup').onclick = async () => { const r = await showSignUpModal(); if (r) window.location.reload(); };
          $('#home-nudge-dismiss').onclick = () => { nudge.remove(); localStorage.setItem('oracle_party_3game_nudge_dismissed', '1'); };
        }
      }
    }

    // --- Home avatar click → profile page ---
    $('#home-avatar').addEventListener('click', () => {
      navigateWithFade('profile.html');
    });

    // --- Sign in link (guests only) ---
    $('#home-signin').addEventListener('click', async (e) => {
      e.preventDefault();
      const result = await showSignInModal();
      if (result) window.location.reload();
    });

    // --- Leaderboards ---
    $('#btn-leaderboard').addEventListener('click', () => {
      navigateWithFade('leaderboard.html');
    });

    // --- Navigation with display name check ---
    $('#btn-host').addEventListener('click', async () => {
      await ensureDisplayName();
      navigateWithFade('host.html');
    });

    $('#btn-join').addEventListener('click', async () => {
      await ensureDisplayName();
      navigateWithFade('join.html');
    });

    // --- Show toast from URL params (e.g., host_left) ---
    const params = new URLSearchParams(window.location.search);
    if (params.get('msg') === 'host_left') {
      const toast = $('#home-toast');
      toast.textContent = 'The host left the game';
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 4000);
      history.replaceState(null, '', window.location.pathname);
    }

    // --- Start ---
    init();
  </script>

</body>
</html>
