<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#F8F7F4">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Google Search Console ownership proof. Public by design — it is only
       meaningful to Google, and it has to be readable by anyone for the check
       to work, so it is not a secret and must not be treated as one.
       Verifying the domain is what lets the Google sign-in consent screen be
       branded as Oracle Party rather than showing the raw Supabase host.
       Google re-checks periodically: removing this line un-verifies the site. -->
  <meta name="google-site-verification" content="yKODwPXNiI4n96uJ_Iq7Hl-mwm6-fLIZgJ7Jjlc-VkI" />
  <title>Oracle Party — Trivia Party Game</title>
  <!-- Google's brand review rejected this page for "does not explain the
       purpose of your app". The page said "Oracle Party" and offered two
       buttons, and nothing anywhere — title, meta, or on screen — said what
       the app was. A reviewer reading the raw HTML would have found a brand
       name and no product. Both this description and the visible tagline
       below exist for that reason; do not delete one and keep the other. -->
  <meta name="description" content="Oracle Party is a free mobile trivia party game. Host a room, share the 6-digit code, and play typed-answer trivia with friends — wagering points on how confident you are.">
  <link rel="canonical" href="https://oracleparty.github.io/">
  <script>(function(){var s=localStorage.getItem('oracle_party_theme');if(!s){s=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';localStorage.setItem('oracle_party_theme',s);}if(s!=='light'){document.documentElement.setAttribute('data-theme',s);var m={'dark':'#1A1A2E','oled':'#000000'};document.querySelector('meta[name="theme-color"]').content=m[s]||'#F8F7F4';}})();if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}</script>
  <script>
    // App-init heartbeat. If the JS module chain fails to load (e.g. esm.sh
    // hiccup blocks the Supabase import), nothing in the page would render
    // and the user sees a blank screen with no error. This timer fires after
    // 7s; if the page module never set window.__appReady, we replace the body
    // with an actionable error instead of leaving it empty. Cleared at the
    // top of each page's init().
    window.__appBootGuard = setTimeout(function () {
      if (window.__appReady) return;
      document.body.style.opacity = '1';
      document.body.innerHTML =
        '<div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;font-family:system-ui,-apple-system,sans-serif;color:#3a3530;background:#F8F7F4;">' +
        '<div style="font-size:48px;margin-bottom:16px;">📡</div>' +
        '<h2 style="font-size:22px;margin:0 0 8px;font-weight:600;">Connection issue</h2>' +
        '<p style="margin:0 0 24px;color:#7a7570;max-width:300px;line-height:1.4;">Couldn\'t reach the app servers. Check your network and try again.</p>' +
        '<button onclick="location.reload()" style="padding:12px 28px;border-radius:999px;border:none;background:#A87830;color:white;font-size:16px;font-weight:600;cursor:pointer;">Reload</button>' +
        '</div>';
    }, 7000);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;0,9..144,900;1,9..144,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
  <link rel="stylesheet" href="css/style.css?v=20260826b">
</head>
<body style="opacity:0">

  <!-- ===== SPLASH SCREEN ===== -->
  <div id="splash" class="screen active" style="display: flex;">
    <!-- Particle container — populated by JS -->
    <div class="splash__particles" id="splash-particles"></div>

    <!-- Glyph ring — authentic Egyptian hieroglyphs (Gardiner sign list) -->
    <div class="splash__ring">
      <span class="splash__glyph" style="--i:0" data-final="𓋹"></span>
      <span class="splash__glyph" style="--i:1" data-final="𓂀"></span>
      <span class="splash__glyph" style="--i:2" data-final="𓅃"></span>
      <span class="splash__glyph" style="--i:3" data-final="𓅝"></span>
      <span class="splash__glyph" style="--i:4" data-final="𓀭"></span>
      <span class="splash__glyph" style="--i:5" data-final="𓇼"></span>
      <span class="splash__glyph" style="--i:6" data-final="𓈉"></span>
      <span class="splash__glyph" style="--i:7" data-final="𓊝"></span>
      <span class="splash__glyph" style="--i:8" data-final="𓃗"></span>
      <span class="splash__glyph" style="--i:9" data-final="𓎿"></span>
      <span class="splash__glyph" style="--i:10" data-final="𓃻"></span>
      <span class="splash__glyph" style="--i:11" data-final="𓆣"></span>
    </div>

    <!-- Title reveal -->
    <h1 class="splash__title">Oracle Party</h1>

    <!-- Eye of Horus — Oracle awakens -->
    <div class="splash__eye" id="splash-eye">𓂀</div>
  </div>

  <!-- ===== HOME SCREEN ===== -->
  <div id="home" class="screen home" style="display: none;">
    <div class="home__glyphs" id="home-glyphs"></div>
    <a href="#" id="home-signin" class="home-signin-link hidden">Sign In</a>
    <div id="home-toast" class="home-toast hidden"></div>
    <div class="home__mark">𓂀</div>
    <h1 class="home__brand">Oracle Party</h1>
    <p class="home__tagline">Trivia party game — host a room, share the code,<br>play with friends.</p>
    <div class="home__divider"></div>
    <div class="home__actions">
      <button class="btn btn-primary btn-block" id="btn-host">Host Game</button>
      <button class="btn btn-secondary btn-block" id="btn-join">Join Game</button>
    </div>
    <nav class="home__dock" id="home-dock">
      <button id="home-avatar" class="home__dock-btn" aria-label="Profile"></button>
      <div class="home__dock-div"></div>
      <button id="btn-leaderboard" class="home__dock-btn home__dock-btn--hiero" aria-label="Leaderboards">𓆣</button>
      <div class="home__dock-div"></div>
      <button id="theme-toggle" class="home__dock-btn theme-toggle" aria-label="Toggle theme"></button>
    </nav>
    <!-- Google's brand verification requires the privacy policy to be linked
         from the home page, on the same domain, so people can actually find
         it. Deliberately quiet: it must be present and reachable, not
         competing with the buttons above it. -->
    <a href="privacy.html" class="home__legal">Privacy</a>
  </div>

  <!-- ===== DISPLAY NAME MODAL ===== -->
  <div id="display-name-modal" class="modal-overlay">
    <div class="modal">
      <h2 class="modal__title">Who Goes There?</h2>
      <input
        type="text"
        id="display-name-input"
        class="input"
        placeholder="Enter your name"
        aria-label="Display name"
        maxlength="20"
        autocomplete="off"
        spellcheck="false"
      >
      <p id="display-name-error" style="color: var(--color-danger); font-size: var(--text-sm); margin-top: var(--space-sm); min-height: 1.2em;"></p>
      <button class="btn btn-primary btn-block" id="display-name-submit" style="margin-top: var(--space-lg);">Continue</button>
    </div>
  </div>

  <!-- Splash animation system — standalone, no module deps -->
  <script>
    (function() {
      var ring = document.querySelector('.splash__ring');
      var splash = document.getElementById('splash');
      var eye = document.getElementById('splash-eye');
      if (!ring || !splash) return;

      var glyphs = ring.querySelectorAll('.splash__glyph');
      var FINAL = [];
      glyphs.forEach(function(g) { FINAL.push(g.getAttribute('data-final')); });
      // Shuffle which glyph lands in which ring position each load
      for (var si = FINAL.length - 1; si > 0; si--) {
        var sj = Math.floor(Math.random() * (si + 1));
        var tmp = FINAL[si]; FINAL[si] = FINAL[sj]; FINAL[sj] = tmp;
      }

      // Pool of scramble hieroglyphs (diverse set for visual chaos)
      var POOL = '𓀀𓀁𓀂𓀃𓀄𓁀𓁁𓁂𓁃𓁄𓂀𓂁𓂂𓂃𓂄𓃀𓃁𓃂𓃃𓃄𓄀𓄁𓄂𓅀𓅁𓅂𓅃𓆀𓆁𓆂𓆃𓇀𓇁𓇂𓇃𓈀𓈁𓈂𓉀𓉁𓊀𓊁𓋀𓋁𓌀𓌁𓍀𓍁𓎀𓎁𓏀𓏁';
      var poolArr = Array.from(POOL);
      function randGlyph() { return poolArr[Math.floor(Math.random() * poolArr.length)]; }

      // Phase 1: Scramble — each glyph cycles at its own chaotic rate
      var locked = new Array(12).fill(false);
      var scrambleTimers = [];

      // Start all glyphs with random content immediately
      glyphs.forEach(function(g, i) {
        g.textContent = randGlyph();
        g.classList.add('splash__glyph--scrambling');
        // Each glyph gets its own scramble interval (40-120ms) for organic chaos
        var rate = 40 + Math.floor(Math.random() * 80);
        scrambleTimers.push(setInterval(function() {
          if (!locked[i]) g.textContent = randGlyph();
        }, rate));
      });

      // Phase 2: Lock in one by one — each lock is a distinct moment
      var lockDelay = 1000; // start locking at 1.0s
      var lockInterval = 80; // 80ms between locks — rapid fire energy

      glyphs.forEach(function(g, i) {
        setTimeout(function() {
          locked[i] = true;
          clearInterval(scrambleTimers[i]);
          // Brief bright flash before settling
          g.classList.remove('splash__glyph--scrambling');
          g.classList.add('splash__glyph--flash');
          g.textContent = FINAL[i];
          // Settle into locked state after flash
          setTimeout(function() {
            g.classList.remove('splash__glyph--flash');
            g.classList.add('splash__glyph--locked');
          }, 70);
        }, lockDelay + i * lockInterval);
      });

      // After all 12 locked: open the eye, start slow spin
      var allLockedTime = lockDelay + 12 * lockInterval + 300;
      setTimeout(function() {
        // Phase 3: Eye opens
        if (eye) {
          eye.classList.add('splash__eye--open');
        }

        // Start slow ring spin after a beat
        setTimeout(function() {
          ring.style.animation = 'none';
          ring.style.opacity = '1';
          var angle = 0, last = performance.now();
          (function spin(now) {
            angle += (now - last) / 1000 * 12;
            last = now;
            ring.style.transform = 'translate(-50%,-50%) rotate(' + angle + 'deg)';
            if (!splash.classList.contains('splash--exiting'))
              requestAnimationFrame(spin);
          })(performance.now());
        }, 400);
      }, allLockedTime);
    })();
  </script>

  <!-- ===== SCRIPTS ===== -->
  <script type="module">
    window.__appReady = true;
    if (window.__appBootGuard) clearTimeout(window.__appBootGuard);
    import { $, transitionScreens, delay, renderAvatar, navigateWithFade } from './js/utils.js';
    import { testConnection, fetchPendingRequests, cleanupOrphanedRooms } from './js/supabase.js';
    import { ensureDisplayName, initAuth, getCurrentUser, getDisplayName, showSignInModal, showSignUpModal } from './js/auth.js';
    import { updatePresence } from './js/presence.js';
    import { initThemeToggle } from './js/theme.js';

    // --- Init: Splash → Home ---
    async function init() {
      document.body.style.opacity = '1';
      const splash = $('#splash');
      const home = $('#home');

      // Spawn floating category glyphs as background texture
      const categoryEmoji = ['⏳','⚗️','🌿','📜','🏛️','🎬','🌍','💻','⚽','🍕','🧩','🃏'];
      const categoryHiero = ['𓋹','𓂀','𓅃','𓅝','𓀭','𓇼','𓈉','𓊝','𓃗','𓎿','𓃻','𓆣'];
      const allGlyphs = [...categoryEmoji, ...categoryHiero];
      const glyphContainer = document.getElementById('home-glyphs');
      const placed = [];
      for (let i = 0; i < 18; i++) {
        const g = document.createElement('span');
        const isHiero = i % allGlyphs.length >= categoryEmoji.length;
        g.className = 'home__glyph' + (isHiero ? ' home__glyph--hiero' : '');
        g.textContent = allGlyphs[i % allGlyphs.length];
        // Truly random, just prevent direct overlap (5% min distance)
        let left, top, attempts = 0;
        do {
          left = 2 + Math.random() * 94;
          top = 3 + Math.random() * 90;
          attempts++;
        } while (attempts < 15 && placed.some(p => Math.hypot(p[0] - left, p[1] - top) < 5));
        placed.push([left, top]);
        g.style.left = `${left}%`;
        g.style.top = `${top}%`;
        g.style.fontSize = `${22 + Math.random() * 10}px`;
        g.style.animationDelay = `${Math.random() * 8}s`;
        g.style.animationDuration = `${8 + Math.random() * 8}s`;
        glyphContainer.appendChild(g);
      }

      // Spawn golden ember particles — fewer, bigger, concentrated near ring
      const particleContainer = document.getElementById('splash-particles');
      for (let i = 0; i < 10; i++) {
        const p = document.createElement('span');
        p.className = 'splash__particle';
        p.style.left = `${25 + Math.random() * 50}%`;
        p.style.animationDelay = `${0.5 + Math.random() * 2}s`;
        p.style.animationDuration = `${2.5 + Math.random() * 1.5}s`;
        p.style.setProperty('--drift', `${(Math.random() - 0.5) * 30}px`);
        particleContainer.appendChild(p);
      }

      // Run both in parallel: minimum splash time + Supabase connection test
      const [, connected] = await Promise.all([
        delay(3000),
        testConnection(),
        initAuth()
      ]);

      if (!connected) {
        console.warn('[Oracle Party] Supabase connection issue — proceeding anyway.');
      }

      // Render home avatar in dock
      const homeAvatar = $('#home-avatar');
      const authUser = getCurrentUser();
      if (authUser?.profile) {
        // Logged in — show their actual avatar
        homeAvatar.innerHTML = renderAvatar({
          displayName: authUser.profile.display_name,
          avatarColor: authUser.profile.avatar_color,
          avatarEmoji: authUser.profile.avatar_emoji
        });
        homeAvatar.classList.add('home__dock-btn--avatar');
      } else {
        // Guest — gold initial
        const displayName = getDisplayName() || '';
        homeAvatar.textContent = displayName ? displayName.charAt(0).toUpperCase() : '?';
        homeAvatar.classList.add('home__dock-btn--initial');
        $('#home-signin').classList.remove('hidden');
      }

      // Theme toggle
      initThemeToggle();

      // Track presence as "home"
      updatePresence({ activity: 'home' });

      // Clean up ghost rooms (fire-and-forget, non-blocking)
      cleanupOrphanedRooms().catch(() => {});

      // Converge elements before fade-out for cinematic exit
      splash.classList.add('splash--exiting');
      await delay(400);
      await transitionScreens(splash, home);

      // Friend request notifications (after home is visible so toast is seen)
      if (authUser) {
        fetchPendingRequests(authUser.user.id).then(pending => {
          if (pending.length > 0) {
            // Toast
            const toast = $('#home-toast');
            toast.textContent = `You have ${pending.length} friend request${pending.length > 1 ? 's' : ''}`;
            toast.classList.remove('hidden');
            toast.style.cursor = 'pointer';
            toast.onclick = () => { window.location.href = 'profile.html?tab=friends'; };
            setTimeout(() => toast.classList.add('hidden'), 4000);
            // Badge on avatar
            const badge = document.createElement('span');
            badge.className = 'home-avatar__badge';
            badge.textContent = pending.length;
            homeAvatar.appendChild(badge);
          }
        });
      }

      // 3-game signup nudge (guests only — rotating perks)
      if (!authUser) {
        const gamesPlayed = parseInt(localStorage.getItem('oracle_party_guest_games') || '0');
        if (gamesPlayed >= 3 && !localStorage.getItem('oracle_party_3game_nudge_dismissed')) {
          const homePerks = [
            'Unlock OLED Black mode and more themes.',
            'Save your stats and earn Oracle titles.',
            'Add friends and see who\u2019s online.',
            'Track your mastery across thousands of questions.',
            'Customize your avatar with colors and emoji.',
            'Compete on leaderboards.',
            `You\u2019ve played ${gamesPlayed} games \u2014 claim your Oracle identity!`
          ];
          const lastPerk = sessionStorage.getItem('oracle_party_last_nudge_perk') || '';
          const pool = homePerks.filter(p => p !== lastPerk);
          const perkText = pool[Math.floor(Math.random() * pool.length)];
          sessionStorage.setItem('oracle_party_last_nudge_perk', perkText);

          const nudge = document.createElement('div');
          nudge.className = 'signup-nudge signup-nudge--home';
          nudge.innerHTML = `
            <p class="signup-nudge__text">${perkText}</p>
            <button class="btn btn-primary" id="home-nudge-signup">Sign Up</button>
            <button class="signup-nudge__dismiss" id="home-nudge-dismiss">&times;</button>
          `;
          home.querySelector('.home__actions').before(nudge);
          $('#home-nudge-signup').onclick = async () => { const r = await showSignUpModal(); if (r) window.location.reload(); };
          $('#home-nudge-dismiss').onclick = () => { nudge.remove(); localStorage.setItem('oracle_party_3game_nudge_dismissed', '1'); };
        }
      }
    }

    // --- Home avatar click → profile page ---
    $('#home-avatar').addEventListener('click', () => {
      navigateWithFade('profile.html');
    });

    // --- Sign in link (guests only) ---
    $('#home-signin').addEventListener('click', async (e) => {
      e.preventDefault();
      const result = await showSignInModal();
      if (result) window.location.reload();
    });

    // --- Leaderboards ---
    $('#btn-leaderboard').addEventListener('click', () => {
      navigateWithFade('leaderboard.html');
    });

    // --- Navigation with display name check ---
    $('#btn-host').addEventListener('click', async () => {
      await ensureDisplayName();
      navigateWithFade('host.html');
    });

    $('#btn-join').addEventListener('click', async () => {
      await ensureDisplayName();
      navigateWithFade('join.html');
    });

    // --- Show toast from URL params (e.g., host_left) ---
    const params = new URLSearchParams(window.location.search);
    if (params.get('msg') === 'host_left') {
      const toast = $('#home-toast');
      toast.textContent = 'The host left the game';
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 4000);
      history.replaceState(null, '', window.location.pathname);
    }

    // --- Start ---
    init();
  </script>

</body>
</html>
