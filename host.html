<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#F8F7F4">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Host Game — Oracle Party</title>
  <script>(function(){var s=localStorage.getItem('oracle_party_theme');if(!s){s=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';localStorage.setItem('oracle_party_theme',s);}if(s!=='light'){document.documentElement.setAttribute('data-theme',s);var m={'dark':'#1A1A2E','oled':'#000000'};document.querySelector('meta[name="theme-color"]').content=m[s]||'#F8F7F4';}})();if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;0,9..144,900;1,9..144,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
  <link rel="stylesheet" href="css/style.css?v=20260405a">
</head>
<body style="opacity:0">

  <!-- ===== CHOOSE CATEGORY SCREEN ===== -->
  <div id="category-screen" class="screen screen--scrollable active" style="display: flex;">
    <header class="page-header">
      <button id="btn-back-home" class="back-btn" aria-label="Back to Home">←</button>
      <h1 class="page-header__title">Choose Category</h1>
      <button class="theme-toggle" aria-label="Toggle theme">🌙</button>
    </header>
    <div class="page-content" style="position: relative; overflow-y: auto; overflow-x: hidden;">
      <!-- Category list (main view) -->
      <div id="category-list">
        <div class="category-search">
          <input
            type="text"
            id="category-search"
            class="input"
            placeholder="Search categories..."
            autocomplete="off"
            spellcheck="false"
          >
        </div>
        <div id="category-grid" class="category-grid">
          <!-- JS populates category cards -->
        </div>
        <div class="placeholder-section">
          <p class="placeholder-section__title">Community Packs</p>
          <p class="placeholder-section__text">Coming soon</p>
        </div>
      </div>
      <!-- Subcategory drill-in view (slides in from right) -->
      <div id="subcategory-view" style="display:none;">
        <div class="subcategory-view__header">
          <button id="subcategory-back" class="back-btn" aria-label="Back to categories">&larr;</button>
          <span id="subcategory-view__title" class="page-header__title"></span>
        </div>
        <div id="subcategory-view__options"></div>
      </div>
    </div>
  </div>

  <!-- ===== HOST SETTINGS SCREEN ===== -->
  <div id="settings-screen" class="screen screen--scrollable" style="display: none;">
    <header class="page-header">
      <button id="btn-back-category" class="back-btn" aria-label="Back to Categories">←</button>
      <h1 class="page-header__title">Game Settings</h1>
    </header>
    <div class="page-content">
      <div id="selected-category" class="selected-category" role="button" style="cursor:pointer;">
        <div class="selected-category__icon"></div>
        <div class="selected-category__name"></div>
        <div class="selected-category__count"></div>
      </div>

      <div class="settings-group">
        <div class="settings-group__label">Who Can Join</div>
        <div class="toggle-group" data-setting="whoCanJoin">
          <button class="toggle-option" data-value="invite">Invite Only</button>
          <button class="toggle-option" data-value="friends">Friends</button>
          <button class="toggle-option active" data-value="anyone">Anyone</button>
        </div>
      </div>

      <div class="settings-group">
        <div class="settings-group__label">Questions Per Game</div>
        <div class="toggle-group" data-setting="questionsPerGame">
          <button class="toggle-option" data-value="5">5</button>
          <button class="toggle-option active" data-value="10">10</button>
          <button class="toggle-option" data-value="15">15</button>
          <button class="toggle-option" data-value="20">20</button>
        </div>
      </div>

      <div class="settings-group">
        <div class="settings-group__label">Question Timer</div>
        <div class="toggle-group" data-setting="questionTimer">
          <button class="toggle-option" data-value="15">15s</button>
          <button class="toggle-option active" data-value="30">30s</button>
          <button class="toggle-option" data-value="45">45s</button>
          <button class="toggle-option" data-value="60">60s</button>
        </div>
      </div>

      <div class="settings-group">
        <div class="settings-group__label">Auto-Proceed</div>
        <div class="toggle-group" data-setting="autoProceed">
          <button class="toggle-option active" data-value="0">Off</button>
          <button class="toggle-option" data-value="8">Slow</button>
          <button class="toggle-option" data-value="4">Fast</button>
        </div>
        <p class="settings-group__hint">Auto-advances between rounds after host reveals answers.</p>
      </div>

      <button id="btn-host-game" class="btn btn-primary btn-block">Host Game</button>
      <p id="host-error" class="error-msg"></p>
    </div>
  </div>

  <!-- ===== CATEGORY BOTTOM SHEET (settings screen) ===== -->
  <div id="category-sheet" class="bottom-sheet">
    <div class="bottom-sheet__backdrop"></div>
    <div class="bottom-sheet__panel">
      <div class="bottom-sheet__handle"></div>
      <div class="bottom-sheet__title">Choose Category</div>
      <div id="category-sheet-list"></div>
    </div>
  </div>

  <!-- ===== DISPLAY NAME MODAL (for direct navigation) ===== -->
  <div id="display-name-modal" class="modal-overlay">
    <div class="modal">
      <h2 class="modal__title">Who Goes There?</h2>
      <input
        type="text"
        id="display-name-input"
        class="input"
        placeholder="Enter your name"
        aria-label="Display name"
        maxlength="20"
        autocomplete="off"
        spellcheck="false"
      >
      <p id="display-name-error" style="color: var(--color-danger); font-size: var(--text-sm); margin-top: var(--space-sm); min-height: 1.2em;"></p>
      <button class="btn btn-primary btn-block" id="display-name-submit" style="margin-top: var(--space-lg);">Continue</button>
    </div>
  </div>

  <!-- ===== SCRIPTS ===== -->
  <script type="module" src="js/host.js?v=20260404"></script>

</body>
</html>
