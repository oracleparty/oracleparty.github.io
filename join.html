<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#F8F7F4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Join Game — Oracle Party</title>
  <script>(function(){var t=localStorage.getItem('oracle_party_theme')||'light';if(t!=='light'){document.documentElement.setAttribute('data-theme',t);var m={'dark':'#1A1A2E','oled':'#000000'};document.querySelector('meta[name="theme-color"]').content=m[t]||'#F8F7F4';}})();</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="join-screen" class="screen screen--scrollable active" style="display: flex;">
    <header class="page-header">
      <button id="btn-back-home" class="back-btn" aria-label="Back to Home">&#8592;</button>
      <h1 class="page-header__title">Join Game</h1>
      <button class="theme-toggle" aria-label="Toggle theme">🌙</button>
    </header>
    <div class="page-content">

      <!-- Room Code Entry -->
      <div class="code-entry">
        <input
          type="text"
          id="code-input"
          class="input"
          placeholder="ABCD"
          aria-label="Room code"
          maxlength="4"
          autocapitalize="characters"
          autocomplete="off"
          spellcheck="false"
          style="text-transform: uppercase"
        >
        <button id="btn-join" class="btn btn-primary">Join</button>
      </div>
      <p id="join-error" class="error-msg"></p>

      <div class="divider"></div>

      <!-- Friends Playing (placeholder) -->
      <div class="placeholder-section" style="margin-top: 0; padding-top: 0; border-top: none;">
        <p class="placeholder-section__title">Friends Playing</p>
        <p class="placeholder-section__text">Coming soon</p>
      </div>

      <div class="divider"></div>

      <!-- Public Games -->
      <p class="section-title">Public Games</p>
      <div id="public-games" class="public-games">
        <p class="empty-state" id="public-games-empty">Looking for games...</p>
      </div>
    </div>
  </div>

  <!-- Display Name Modal -->
  <div id="display-name-modal" class="modal-overlay">
    <div class="modal">
      <h2 class="modal__title">Who Goes There?</h2>
      <input
        type="text"
        id="display-name-input"
        class="input"
        placeholder="Enter your name"
        aria-label="Display name"
        maxlength="20"
        autocomplete="off"
        spellcheck="false"
      >
      <p id="display-name-error" style="color: var(--color-danger); font-size: var(--text-sm); margin-top: var(--space-sm); min-height: 1.2em;"></p>
      <button class="btn btn-primary btn-block" id="display-name-submit" style="margin-top: var(--space-lg);">Continue</button>
    </div>
  </div>

  <script type="module" src="js/join.js"></script>

</body>
</html>
