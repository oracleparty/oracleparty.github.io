# Robot playtests — real browsers playing the real game on every push.
#
# These never contact Supabase: the client library is swapped for an in-memory
# stand-in, so no test data can reach the production database and no robot can
# appear in a real lobby.
#
# Kept separate from ci.yml because it needs a browser download and takes
# minutes rather than seconds. Unit tests stay fast and run on everything.
name: Robot Playtests

on:
  push:
  workflow_dispatch:

jobs:
  playtest:
    runs-on: ubuntu-latest
    # THE SUITE OUTGREW 25 MINUTES, AND A TIMEOUT IS NOT A FAILURE — GitHub
    # cancels the job, which reads as "cancelled" rather than red, and the last
    # four steps simply never ran. That happened on 2026-09-01: fifteen steps
    # green, the run killed during the bots scenario, and bots, accuracy and
    # both layout sweeps went uncovered without anything saying so.
    #
    # It had been sitting at ~22 minutes for a while, so the margin was already
    # gone; one more scenario section spent it. Raised well past the current
    # ~24, not to the next round number above it, because the next addition
    # should not re-buy this lesson.
    #
    # If it approaches this again, SPLIT THE JOB rather than raising it further:
    # a suite that takes three quarters of an hour is one nobody waits for, and
    # a check nobody waits for is a check nobody reads.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only Chromium: the game is mobile-only and every scenario emulates a
      # phone viewport.
      - run: npx playwright install --with-deps chromium

      - name: Lobby — host and two players see each other
        run: node tests/harness/scenario-lobby.mjs

      - name: Full game — completion, score agreement, channel cleanup
        run: node tests/harness/scenario-fullgame.mjs

      - name: Nasty — host away, rejoin, simultaneous answers
        run: node tests/harness/scenario-nasty.mjs

      - name: Play Again — second game, room reset, no state leakage
        run: node tests/harness/scenario-playagain.mjs

      - name: Social — chat, honks, score editing, question review
        run: node tests/harness/scenario-social.mjs

      - name: Join — public listing, privacy, hot join, bad codes
        run: node tests/harness/scenario-join.mjs

      - name: Feedback — votes, flags, and timer expiry scoring
        run: node tests/harness/scenario-feedback.mjs

      - name: Co-host — promote, demote, and gated controls
        run: node tests/harness/scenario-cohost.mjs

      # The signed-in half of the app — profile, leaderboard, friends — which
      # no robot could reach until the harness learned to sign in. Also plays a
      # lobby of signed-in players, the combination that overflowed in a live
      # game and that a lobby of guests cannot reproduce.
      - name: Accounts — profile, leaderboard, friends, signed-in lobby
        run: node tests/harness/scenario-account.mjs

      # The admin dashboard, gated on is_admin and unreachable until the
      # harness could sign in. Includes the check that matters most in this
      # project: when the database refuses a write it returns NO error, and the
      # page must say so rather than report success.
      - name: Admin — gate, counts, flags, and refused writes
        run: node tests/harness/scenario-admin.mjs

      # The practice bot: added by a human, never host, answers instantly, and
      # recorded nowhere. The last of those is the one that matters — a bot's
      # answers come from a chosen percentage, so counting them would put that
      # number into the only real data this project has.
      - name: Bots — added by a human, never host, never recorded
        run: node tests/harness/scenario-bots.mjs

      # question_history holds COUNTERS, and accuracy is their ratio, so a
      # host's own corrections used to damage the number they were correcting.
      # Nothing about this is visible from the app — it surfaces weeks later as
      # a slightly-too-low percentage on a profile page — so the rows are read
      # directly.
      - name: Accuracy — an override is not a second attempt, a disqualified round is none
        run: node tests/harness/scenario-accuracy.mjs

      # Measures every screen at both phone widths. The robots sign in as
      # nobody, so they cannot see a layout that only breaks for an account
      # with a tier badge — which is exactly the bug that reached a live game.
      - name: Layout — overflow, ragged rows, and mock drift
        run: node scripts/layout-sweep.mjs

      # Same screens with the longest plausible names and titles. A layout that
      # only fits its mock data is one real display name away from breaking.
      #
      # One theme only: stress is about how long text is, themes are about what
      # colour it is, and running the cross-product triples the time for nothing.
      - name: Layout under stress — long names and titles
        run: node scripts/layout-sweep.mjs --stress --themes=light
