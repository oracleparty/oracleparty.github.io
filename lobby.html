<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#F8F7F4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Lobby — Oracle Party</title>
  <script>(function(){var t=localStorage.getItem('oracle_party_theme')||'light';if(t!=='light'){document.documentElement.setAttribute('data-theme',t);var m={'dark':'#1A1A2E','oled':'#000000'};document.querySelector('meta[name="theme-color"]').content=m[t]||'#F8F7F4';}})();</script>
  <link rel="stylesheet" href="css/style.css?v=20260403d">
  <style>html, body { overscroll-behavior-y: contain; }</style>
</head>
<body>

  <div id="lobby-screen" class="screen active" style="display: flex;">
    <div class="lobby-body">

      <!-- Compact Header: brand + title + leave -->
      <div class="lobby-header">
        <div class="lobby-header__top">
          <div class="lobby-header__brand">Oracle Party</div>
          <button class="theme-toggle" aria-label="Toggle theme">🌙</button>
          <button id="btn-leave" class="leave-btn">Leave</button>
        </div>
        <div class="lobby-header__meta">
          <p id="lobby-category" class="lobby-category"></p>
          <button id="btn-settings" class="settings-trigger-btn hidden">Settings</button>
        </div>
        <div class="lobby-header__code">
          <span id="lobby-code" class="lobby-code"></span>
          <button id="btn-copy-code" class="copy-btn">Copy</button>
        </div>
      </div>

      <!-- Players: compact, scrolls only if many players -->
      <div class="lobby-players">
        <div class="section-title">Players <span id="player-count"></span></div>
        <div id="player-list" class="player-list"></div>
        <!-- Room Session Scores (shown after returning from a game) -->
        <div id="room-scores" class="room-scores" style="display:none;">
          <div class="section-title">Room Scores</div>
          <div id="room-scores-list"></div>
        </div>
      </div>

      <!-- Chat: fills remaining space -->
      <div class="lobby-chat">
        <div class="section-title">Chat</div>
        <div class="lobby-chat__scroll">
          <div id="chat-drawer-messages" class="lobby-chat__messages"></div>
          <div id="typing-indicator" class="typing-indicator"></div>
        </div>
        <div class="lobby-chat__input">
          <input
            type="text"
            id="chat-drawer-input"
            class="input"
            placeholder="Say something..."
            aria-label="Chat message"
            maxlength="200"
            autocomplete="off"
            spellcheck="false"
          >
          <button id="btn-chat-send" class="btn btn-primary">Send</button>
        </div>
      </div>

      <!-- Footer: Action buttons only -->
      <div class="lobby-footer">
        <button id="btn-start-game" class="btn btn-primary btn-block hidden">Start Game</button>
        <button id="btn-ready" class="btn btn-secondary btn-block hidden">Ready Up</button>
      </div>

    </div>
  </div>

  <!-- Settings Modal (host only) -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal settings-modal">
      <h2 class="modal__title">Game Settings</h2>

      <div class="settings-group">
        <div class="settings-group__label">Category</div>
        <div id="settings-category-grid" class="category-grid settings-category-grid"></div>
      </div>

      <div class="settings-group">
        <div class="settings-group__label">Who Can Join</div>
        <div class="toggle-group" data-setting="whoCanJoin">
          <button class="toggle-option" data-value="invite">Invite Only</button>
          <button class="toggle-option" data-value="friends">Friends</button>
          <button class="toggle-option" data-value="anyone">Anyone</button>
        </div>
      </div>

      <div class="settings-group">
        <div class="settings-group__label">Questions Per Game</div>
        <div class="toggle-group" data-setting="questionsPerGame">
          <button class="toggle-option" data-value="5">5</button>
          <button class="toggle-option" data-value="10">10</button>
          <button class="toggle-option" data-value="15">15</button>
          <button class="toggle-option" data-value="20">20</button>
        </div>
      </div>

      <div class="settings-group">
        <div class="settings-group__label">Question Timer</div>
        <div class="toggle-group" data-setting="questionTimer">
          <button class="toggle-option" data-value="15">15s</button>
          <button class="toggle-option" data-value="30">30s</button>
          <button class="toggle-option" data-value="45">45s</button>
          <button class="toggle-option" data-value="60">60s</button>
        </div>
      </div>

      <div class="settings-group">
        <div class="settings-group__label">Auto-Proceed</div>
        <div class="toggle-group" data-setting="autoProceed">
          <button class="toggle-option" data-value="0">Off</button>
          <button class="toggle-option" data-value="8">Slow</button>
          <button class="toggle-option" data-value="4">Fast</button>
        </div>
        <p class="settings-group__hint">Auto-advances between rounds after host reveals answers.</p>
      </div>

      <button id="btn-close-settings" class="btn btn-primary btn-block" style="margin-top: var(--space-lg);">Done</button>
    </div>
  </div>

  <!-- Display Name Modal (fallback) -->
  <div id="display-name-modal" class="modal-overlay">
    <div class="modal">
      <h2 class="modal__title">Who Goes There?</h2>
      <input
        type="text"
        id="display-name-input"
        class="input"
        placeholder="Enter your name"
        aria-label="Display name"
        maxlength="20"
        autocomplete="off"
        spellcheck="false"
      >
      <p id="display-name-error" style="color: var(--color-danger); font-size: var(--text-sm); margin-top: var(--space-sm); min-height: 1.2em;"></p>
      <button class="btn btn-primary btn-block" id="display-name-submit" style="margin-top: var(--space-lg);">Continue</button>
    </div>
  </div>

  <!-- Category Bottom Sheet (lobby settings) -->
  <div id="category-sheet" class="bottom-sheet">
    <div class="bottom-sheet__backdrop"></div>
    <div class="bottom-sheet__panel">
      <div class="bottom-sheet__handle"></div>
      <div class="bottom-sheet__title">Choose Category</div>
      <div id="category-sheet-list"></div>
    </div>
  </div>

  <script type="module" src="js/lobby.js"></script>

</body>
</html>
