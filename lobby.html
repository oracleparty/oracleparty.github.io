<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#F8F7F4">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Lobby — Oracle Party</title>
  <script>(function(){var s=localStorage.getItem('oracle_party_theme');if(!s){s=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';localStorage.setItem('oracle_party_theme',s);}if(s!=='light'){document.documentElement.setAttribute('data-theme',s);var m={'dark':'#1A1A2E','oled':'#000000'};document.querySelector('meta[name="theme-color"]').content=m[s]||'#F8F7F4';}})();if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}</script>
  <script>
    // App-init heartbeat. If the JS module chain fails to load (e.g. esm.sh
    // hiccup blocks the Supabase import), nothing in the page would render
    // and the user sees a blank screen with no error. This timer fires after
    // 7s; if the page module never set window.__appReady, we replace the body
    // with an actionable error instead of leaving it empty. Cleared at the
    // top of each page's init().
    window.__appBootGuard = setTimeout(function () {
      if (window.__appReady) return;
      document.body.style.opacity = '1';
      document.body.innerHTML =
        '<div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;font-family:system-ui,-apple-system,sans-serif;color:#3a3530;background:#F8F7F4;">' +
        '<div style="font-size:48px;margin-bottom:16px;">📡</div>' +
        '<h2 style="font-size:22px;margin:0 0 8px;font-weight:600;">Connection issue</h2>' +
        '<p style="margin:0 0 24px;color:#7a7570;max-width:300px;line-height:1.4;">Couldn\'t reach the app servers. Check your network and try again.</p>' +
        '<button onclick="location.reload()" style="padding:12px 28px;border-radius:999px;border:none;background:#A87830;color:white;font-size:16px;font-weight:600;cursor:pointer;">Reload</button>' +
        '</div>';
    }, 7000);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;0,9..144,900;1,9..144,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
  <link rel="stylesheet" href="css/style.css?v=20260905b">
  <style>html, body { overscroll-behavior-y: contain; }</style>
</head>
<body style="opacity:0">

  <div id="lobby-screen" class="screen active" style="display: flex;">
    <div class="lobby-body">

      <!-- Utility bar -->
      <div class="lobby-bar">
        <span class="lobby-bar__brand">Oracle Party</span>
        <span class="lobby-bar__spacer"></span>
        <button class="theme-toggle" aria-label="Toggle theme">🌙</button>
        <button id="btn-leave" class="leave-btn">Leave</button>
      </div>

      <!-- Scrollable content -->
      <div class="lobby-scroll">

        <!-- Room identity card -->
        <div class="lobby-room">
          <div class="lobby-room__card">
            <button id="btn-settings" class="lobby-room__settings hidden" aria-label="Settings">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
            <div id="btn-category-tap" class="lobby-room__card-top">
              <span id="lobby-category-icon" class="lobby-room__card-icon"></span>
              <span id="lobby-category" class="lobby-room__card-label"></span>
            </div>
            <button id="btn-copy-code" class="lobby-room__card-bottom" aria-label="Copy room code">
              <span id="lobby-code" class="lobby-room__card-code"></span>
              <span class="lobby-room__card-hint">tap to copy</span>
            </button>
          </div>
        </div>

        <!-- Host / Co-hosts -->
        <div class="lobby-hosts">
          <div class="section-title">Host</div>
          <div id="host-list"></div>
        </div>

        <!-- Players -->
        <div class="lobby-players">
          <div class="section-title">Players</div>
          <div id="player-list" class="player-list"></div>
          <button id="btn-add-bot" class="btn-add-bot hidden">+ Practice Bot</button>
          <div id="room-scores" class="room-scores" style="display:none;">
            <div class="section-title">Room Scores</div>
            <div id="room-scores-list"></div>
          </div>
        </div>

        <!-- Chat messages + input together -->
        <div class="lobby-chat">
          <div class="section-title">Chat</div>
          <div id="chat-drawer-messages" class="lobby-chat__messages"></div>
          <div id="typing-indicator" class="typing-indicator"></div>
          <div class="lobby-chat__input">
            <input type="text" id="chat-drawer-input" class="input"
              placeholder="Say something..." aria-label="Chat message"
              maxlength="200" autocomplete="off" spellcheck="false">
            <button id="btn-chat-send" class="btn btn-primary">Send</button>
          </div>
        </div>

      </div>

      <!-- Pinned footer: just action button -->
      <div class="lobby-footer">
        <button id="btn-start-game" class="btn btn-primary btn-block hidden">Start Game</button>
        <button id="btn-ready" class="btn btn-secondary btn-block hidden">Ready Up</button>
      </div>

    </div>
  </div>

  <!-- Settings Modal (host only) -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal settings-modal">
      <h2 class="modal__title">Game Settings</h2>

      <div class="settings-group">
        <div class="settings-group__label">Category</div>
        <div id="settings-category-grid" class="category-grid settings-category-grid"></div>
      </div>

      <div class="settings-group">
        <div class="settings-group__label">Who Can Join</div>
        <div class="toggle-group" data-setting="whoCanJoin">
          <button class="toggle-option" data-value="invite">Invite Only</button>
          <button class="toggle-option" data-value="friends">Friends</button>
          <button class="toggle-option" data-value="anyone">Anyone</button>
        </div>
      </div>

      <div class="settings-group">
        <div class="settings-group__label">Questions Per Game</div>
        <div class="toggle-group" data-setting="questionsPerGame">
          <button class="toggle-option" data-value="5">5</button>
          <button class="toggle-option" data-value="10">10</button>
          <button class="toggle-option" data-value="15">15</button>
          <button class="toggle-option" data-value="20">20</button>
        </div>
      </div>

      <div class="settings-group">
        <div class="settings-group__label">Question Timer</div>
        <div class="toggle-group" data-setting="questionTimer">
          <button class="toggle-option" data-value="15">15s</button>
          <button class="toggle-option" data-value="30">30s</button>
          <button class="toggle-option" data-value="45">45s</button>
          <button class="toggle-option" data-value="60">60s</button>
        </div>
      </div>

      <div class="settings-group">
        <div class="settings-group__label">Auto-Proceed</div>
        <div class="toggle-group" data-setting="autoProceed">
          <button class="toggle-option" data-value="0">Off</button>
          <button class="toggle-option" data-value="8">Slow</button>
          <button class="toggle-option" data-value="4">Fast</button>
        </div>
        <p class="settings-group__hint">Auto-advances between rounds after host reveals answers.</p>
      </div>

      <button id="btn-close-settings" class="btn btn-primary btn-block" style="margin-top: var(--space-lg);">Done</button>
    </div>
  </div>

  <!-- Display Name Modal (fallback) -->
  <div id="display-name-modal" class="modal-overlay">
    <div class="modal">
      <h2 class="modal__title">Who Goes There?</h2>
      <input
        type="text"
        id="display-name-input"
        class="input"
        placeholder="Enter your name"
        aria-label="Display name"
        maxlength="20"
        autocomplete="off"
        spellcheck="false"
      >
      <p id="display-name-error" style="color: var(--color-danger); font-size: var(--text-sm); margin-top: var(--space-sm); min-height: 1.2em;"></p>
      <button class="btn btn-primary btn-block" id="display-name-submit" style="margin-top: var(--space-lg);">Continue</button>
    </div>
  </div>

  <!-- Category Bottom Sheet (lobby settings) -->
  <div id="category-sheet" class="bottom-sheet">
    <div class="bottom-sheet__backdrop"></div>
    <div class="bottom-sheet__panel">
      <div class="bottom-sheet__handle"></div>
      <div class="bottom-sheet__title">Choose Category</div>
      <div id="category-sheet-list"></div>
    </div>
  </div>

  <script type="module" src="js/lobby.js?v=20260905b"></script>

</body>
</html>
