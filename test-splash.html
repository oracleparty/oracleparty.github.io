<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splash Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #F8F7F4; height: 100vh; overflow: hidden; }
  #splash {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #F8F7F4;
  }
  .splash__ring {
    position: absolute;
    width: 240px; height: 240px;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    animation: ring-enter 1.5s ease-out 0.2s both;
    z-index: 1;
  }
  @keyframes ring-enter {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.6) rotate(-30deg); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
  }
  .splash__glyph {
    position: absolute;
    top: 50%; left: 50%;
    width: 24px; height: 24px;
    margin: -12px 0 0 -12px;
    font-size: 18px; line-height: 24px;
    text-align: center;
    color: #96691F;
    opacity: 0;
    transform: rotate(calc(var(--i) * 30deg)) translateY(-120px) rotate(calc(var(--i) * -30deg));
    animation: glyph-appear 0.6s ease-out both;
    animation-delay: calc(0.3s + var(--i) * 0.1s);
  }
  @keyframes glyph-appear {
    from { opacity: 0; transform: rotate(calc(var(--i) * 30deg)) translateY(-80px) rotate(calc(var(--i) * -30deg)); }
    to   { opacity: 0.5; transform: rotate(calc(var(--i) * 30deg)) translateY(-120px) rotate(calc(var(--i) * -30deg)); }
  }
  h1 { font-family: Georgia, serif; font-size: 2.25rem; color: #96691F; z-index: 2; }
  #status {
    position: fixed; bottom: 20px; left: 20px; right: 20px;
    font-family: monospace; font-size: 14px; color: #333;
    background: rgba(255,255,255,0.9); padding: 10px; border-radius: 8px;
    z-index: 999;
  }
</style>
</head>
<body>
<div id="splash">
  <div class="splash__ring" id="ring">
    <span class="splash__glyph" style="--i:0">𓋹</span>
    <span class="splash__glyph" style="--i:1">𓂀</span>
    <span class="splash__glyph" style="--i:2">𓅃</span>
    <span class="splash__glyph" style="--i:3">𓏞</span>
    <span class="splash__glyph" style="--i:4">𓀭</span>
    <span class="splash__glyph" style="--i:5">𓇳</span>
    <span class="splash__glyph" style="--i:6">𓇯</span>
    <span class="splash__glyph" style="--i:7">𓊝</span>
    <span class="splash__glyph" style="--i:8">𓃗</span>
    <span class="splash__glyph" style="--i:9">𓋍</span>
    <span class="splash__glyph" style="--i:10">𓁹</span>
    <span class="splash__glyph" style="--i:11">𓆣</span>
  </div>
  <h1>Oracle Party</h1>
</div>
<div id="status">Waiting for enter animation...</div>
<script>
  const ring = document.getElementById('ring');
  const status = document.getElementById('status');

  setTimeout(() => {
    ring.style.animation = 'none';
    ring.style.opacity = '1';
    let angle = 0, last = performance.now();
    status.textContent = 'JS spin started!';
    (function spin(now) {
      angle += (now - last) / 1000 * 18;
      last = now;
      ring.style.transform = 'translate(-50%,-50%) rotate(' + angle + 'deg)';
      status.textContent = 'Spinning: ' + angle.toFixed(1) + '°';
      requestAnimationFrame(spin);
    })(performance.now());
  }, 1800);
</script>
</body>
</html>
