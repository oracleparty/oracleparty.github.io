<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#F8F7F4">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Oracle Party — Profile</title>
  <script>(function(){var s=localStorage.getItem('oracle_party_theme');if(!s){s=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';localStorage.setItem('oracle_party_theme',s);}if(s!=='light'){document.documentElement.setAttribute('data-theme',s);var m={'dark':'#1A1A2E','oled':'#000000'};document.querySelector('meta[name="theme-color"]').content=m[s]||'#F8F7F4';}})();if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}</script>
  <script>
    // App-init heartbeat. If the JS module chain fails to load (e.g. esm.sh
    // hiccup blocks the Supabase import), nothing in the page would render
    // and the user sees a blank screen with no error. This timer fires after
    // 7s; if the page module never set window.__appReady, we replace the body
    // with an actionable error instead of leaving it empty. Cleared at the
    // top of each page's init().
    window.__appBootGuard = setTimeout(function () {
      if (window.__appReady) return;
      document.body.style.opacity = '1';
      document.body.innerHTML =
        '<div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;font-family:system-ui,-apple-system,sans-serif;color:#3a3530;background:#F8F7F4;">' +
        '<div style="font-size:48px;margin-bottom:16px;">📡</div>' +
        '<h2 style="font-size:22px;margin:0 0 8px;font-weight:600;">Connection issue</h2>' +
        '<p style="margin:0 0 24px;color:#7a7570;max-width:300px;line-height:1.4;">Couldn\'t reach the app servers. Check your network and try again.</p>' +
        '<button onclick="location.reload()" style="padding:12px 28px;border-radius:999px;border:none;background:#A87830;color:white;font-size:16px;font-weight:600;cursor:pointer;">Reload</button>' +
        '</div>';
    }, 7000);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;0,9..144,900;1,9..144,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
  <link rel="stylesheet" href="css/style.css?v=20260820j">
</head>
<body style="opacity:0">

  <div class="screen screen--scrollable active" style="display: flex; flex-direction: column;">

    <!-- Header bar -->
    <div class="page-header">
      <button class="page-header__back" id="btn-back">&larr;</button>
      <h1 class="page-header__title">Profile</h1>
      <button class="theme-toggle" aria-label="Toggle theme">🌙</button>
    </div>

    <!-- Profile Header -->
    <div class="profile-header">
      <div id="profile-avatar" class="profile-header__avatar"></div>
      <div id="profile-name" class="profile-header__name"></div>
      <div id="profile-title" class="profile-header__title"></div>
    </div>

    <!-- Title Builder -->
    <div id="title-builder-section" class="title-builder-section" style="display:none;">
      <div id="title-builder-locked" class="title-builder-locked">
        <span class="title-builder-locked__icon">&#x1F512;</span>
        <p class="title-builder-locked__text">Reach Apprentice to unlock the Title Builder</p>
      </div>
      <div id="title-builder-wheel" class="title-builder-wheel" style="display:none;">
        <div id="title-preview" class="title-builder__preview">Novice</div>
        <div class="title-builder__columns">
          <div id="wheel-slot1" class="title-wheel-column"></div>
          <div id="wheel-slot2" class="title-wheel-column"></div>
          <div id="wheel-slot3" class="title-wheel-column"></div>
        </div>
        <p id="title-hint-toast" class="title-builder__hint"></p>
        <p id="title-uniqueness" class="title-builder__uniqueness"></p>
        <button id="btn-save-title" class="btn btn-primary">Save Title</button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="profile-tabs" role="tablist" aria-label="Profile sections">
      <button class="profile-tab active" data-tab="profile" role="tab" aria-selected="true" aria-controls="profile-tab-content">Profile</button>
      <button class="profile-tab" data-tab="friends" role="tab" aria-selected="false" aria-controls="friends-tab-content">Friends <span id="friends-tab-badge" class="profile-tab__badge hidden"></span></button>
    </div>

    <!-- ===== PROFILE TAB ===== -->
    <div id="profile-tab-content" role="tabpanel" aria-labelledby="tab-profile">

      <!-- Bio -->
      <div class="profile-section">
        <div class="profile-section__label">Bio</div>
        <div id="profile-bio" class="profile-bio"></div>
      </div>

      <!-- Favorite Category -->
      <div class="profile-section">
        <div class="profile-section__label">Favorite Category</div>
        <div id="profile-fav-categories" class="profile-fav-categories"></div>
      </div>

      <!-- Stats Summary -->
      <div class="profile-section">
        <div class="profile-section__label">Stats</div>
        <div id="profile-stats" class="profile-stats"></div>
      </div>

      <!-- Mastery Progress. This one really is completion — how much of the
           question bank you have got right at least once — which is a
           different question from Proficiency below, and the reason both
           exist. Its percentage will sit near zero for a long time; that is
           what 4,859 questions looks like, not a bug. -->
      <div class="profile-section">
        <div class="profile-section__label">Mastery</div>
        <p class="profile-section__hint">How much of the question bank you have answered correctly.</p>
        <div id="profile-mastery"></div>
      </div>

      <!-- Per-Category Breakdown.
           Called Proficiency, not Categories, because the number in each row
           is correct-answers over questions-answered and nothing on the page
           said so. "Categories" named the rows; it did not name the measure,
           and the section above it is a completion count, so the two were easy
           to read as the same kind of number. -->
      <div class="profile-section">
        <div class="profile-section__label">Proficiency</div>
        <p class="profile-section__hint">How often you answer correctly, per category.</p>
        <div id="profile-categories" class="profile-category-grid"></div>
      </div>

      <!-- Recent Games -->
      <div class="profile-section">
        <div class="profile-section__label">Recent Games</div>
        <div id="profile-games"></div>
      </div>

      <!-- Account -->
      <div class="profile-section" style="padding-bottom: var(--space-2xl);">
        <div class="profile-section__label">Account</div>
        <div id="profile-account"></div>
      </div>

    </div>

    <!-- ===== FRIENDS TAB ===== -->
    <div id="friends-tab-content" role="tabpanel" aria-labelledby="tab-friends" style="display: none;">

      <!-- Search -->
      <div class="profile-section">
        <input id="friends-search-input" class="input" placeholder="Search by name or Name#1234" autocomplete="off" spellcheck="false">
        <div id="friends-search-results"></div>
      </div>

      <!-- Pending Requests -->
      <div id="friends-pending" class="profile-section" style="display: none;">
        <div class="profile-section__label">Pending Requests</div>
        <div id="friends-pending-list"></div>
      </div>

      <!-- Friends List -->
      <div class="profile-section">
        <div class="profile-section__label">Friends</div>
        <div id="friends-list"></div>
      </div>

    </div>

  </div>

  <!-- Display Name Modal (required by auth.js) -->
  <div id="display-name-modal" class="modal-overlay">
    <div class="modal">
      <h2 class="modal__title">Who Goes There?</h2>
      <input type="text" id="display-name-input" class="input" placeholder="Enter your name" aria-label="Display name" maxlength="20" autocomplete="off" spellcheck="false">
      <p id="display-name-error" style="color: var(--color-danger); font-size: var(--text-sm); margin-top: var(--space-sm); min-height: 1.2em;"></p>
      <button class="btn btn-primary btn-block" id="display-name-submit" style="margin-top: var(--space-lg);">Continue</button>
    </div>
  </div>

  <script type="module">
    window.__appReady = true;
    if (window.__appBootGuard) clearTimeout(window.__appBootGuard);
    import { ensureDisplayName, initAuth } from './js/auth.js';
    import { initProfilePage } from './js/profile.js';
    import { initThemeToggle } from './js/theme.js';
    import { navigateWithFade } from './js/utils.js';

    async function init() {
      document.body.style.opacity = '1';
      await initAuth();
      await initProfilePage();
      initThemeToggle();
    }

    document.getElementById('btn-back').addEventListener('click', () => {
      navigateWithFade('index.html');
    });

    // Trap browser back button
    history.pushState({ page: 'profile' }, '');
    window.addEventListener('popstate', () => { window.location.href = 'index.html'; });

    init();
  </script>

</body>
</html>
