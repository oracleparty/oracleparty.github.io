<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#F8F7F4">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Oracle Party — Admin</title>
  <script>(function(){var s=localStorage.getItem('oracle_party_theme');if(!s){s=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';localStorage.setItem('oracle_party_theme',s);}if(s!=='light'){document.documentElement.setAttribute('data-theme',s);var m={'dark':'#1A1A2E','oled':'#000000'};document.querySelector('meta[name="theme-color"]').content=m[s]||'#F8F7F4';}})();if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}</script>
  <script>
    // App-init heartbeat. If the JS module chain fails to load (e.g. esm.sh
    // hiccup blocks the Supabase import), nothing in the page would render
    // and the user sees a blank screen with no error. This timer fires after
    // 7s; if the page module never set window.__appReady, we replace the body
    // with an actionable error instead of leaving it empty. Cleared at the
    // top of each page's init().
    window.__appBootGuard = setTimeout(function () {
      if (window.__appReady) return;
      document.body.style.opacity = '1';
      document.body.innerHTML =
        '<div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;font-family:system-ui,-apple-system,sans-serif;color:#3a3530;background:#F8F7F4;">' +
        '<div style="font-size:48px;margin-bottom:16px;">📡</div>' +
        '<h2 style="font-size:22px;margin:0 0 8px;font-weight:600;">Connection issue</h2>' +
        '<p style="margin:0 0 24px;color:#7a7570;max-width:300px;line-height:1.4;">Couldn\'t reach the app servers. Check your network and try again.</p>' +
        '<button onclick="location.reload()" style="padding:12px 28px;border-radius:999px;border:none;background:#A87830;color:white;font-size:16px;font-weight:600;cursor:pointer;">Reload</button>' +
        '</div>';
    }, 7000);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;0,9..144,900;1,9..144,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
  <link rel="stylesheet" href="css/style.css?v=20260824g">
</head>
<body style="opacity:0">

  <div class="screen screen--scrollable active" style="display: flex; flex-direction: column;">

    <div class="page-header">
      <a href="index.html" class="back-btn" aria-label="Back">&larr;</a>
      <h1 class="page-header__title">Admin Dashboard</h1>
    </div>

    <div id="admin-loading" style="text-align:center; padding: var(--space-xl); color: var(--color-text-muted);">Loading...</div>

    <div id="admin-content" style="display:none; width:100%;">

      <!-- ===== STATS CARDS ===== -->
      <div class="admin-section">
        <!-- Buttons, not divs. Each opens the list behind its number below.
             A number with no way to see what it is made of is a number you
             have to trust; these were the only figures on this page that
             could not be checked. -->
        <div class="admin-stats">
          <button class="admin-stat-card" data-drill="online" aria-expanded="false"><div id="stat-online" class="admin-stat-card__value">-</div><div class="admin-stat-card__label">Players Online</div></button>
          <button class="admin-stat-card" data-drill="games" aria-expanded="false"><div id="stat-games" class="admin-stat-card__value">-</div><div class="admin-stat-card__label">Games Active</div></button>
          <button class="admin-stat-card" data-drill="accounts" aria-expanded="false"><div id="stat-accounts" class="admin-stat-card__value">-</div><div class="admin-stat-card__label">Total Accounts</div></button>
          <button class="admin-stat-card" data-drill="today" aria-expanded="false"><div id="stat-today" class="admin-stat-card__value">-</div><div class="admin-stat-card__label">Games Today</div></button>
        </div>
        <div id="stat-drill" class="stat-drill hidden">
          <div class="stat-drill__head">
            <span id="stat-drill-title" class="stat-drill__title"></span>
            <button id="stat-drill-close" class="icon-btn" aria-label="Close">&#x2715;</button>
          </div>
          <div id="stat-drill-body" class="stat-drill__body"></div>
        </div>
      </div>

      <!-- ===== PANELS =====
           Every section used to be open at once: nine stacked lists on a
           375px phone, each fetched on load whether or not anyone looked at
           it. Now each is a closed row showing its name and its number, and
           opens on a tap. Ordered by how often an admin needs it, which is
           why Flagged Questions is first and Feature Flags is last — before
           this, the question bank was at the very bottom of the longest page
           in the app.

           A panel's data is fetched the first time it is opened, not on page
           load. The counts on the closed rows are `head: true` counts, so the
           page knows how much is behind each door without opening any. -->
      <div class="admin-panels">

        <!-- ===== FLAGGED QUEUE ===== -->
        <section class="admin-panel">
          <button class="admin-panel__head" data-panel="flagged" aria-expanded="false" aria-controls="panel-flagged">
            <span class="admin-panel__title">Flagged Questions</span>
            <span class="admin-panel__count" data-count="flagged">·</span>
            <span class="admin-panel__chev" aria-hidden="true">▾</span>
          </button>
          <div class="admin-panel__body" id="panel-flagged" hidden>
            <div id="flagged-queue"></div>
          </div>
        </section>

        <!-- ===== QUESTION HEALTH ===== -->
        <section class="admin-panel">
          <button class="admin-panel__head" data-panel="health" aria-expanded="false" aria-controls="panel-health">
            <span class="admin-panel__title">Question Health</span>
            <span class="admin-panel__count" data-count="health">·</span>
            <span class="admin-panel__chev" aria-hidden="true">▾</span>
          </button>
          <div class="admin-panel__body" id="panel-health" hidden>
            <div class="admin-qh__controls">
              <select id="qh-sort" class="input" style="flex:1; min-width:150px;">
                <option value="flags" selected>Flags</option>
                <option value="overrides">Overrides</option>
                <option value="correct">% correct</option>
                <option value="liked">% liked</option>
                <option value="asked">Times played</option>
              </select>
              <select id="qh-dir" class="input" style="flex:0 0 auto; min-width:110px;">
                <option value="desc">Most first</option>
                <option value="asc">Least first</option>
              </select>
              <input id="qh-search" class="input" placeholder="Search questions..." style="flex:1; min-width:150px;">
            </div>
            <p id="qh-summary" style="font-size:var(--text-xs); color:var(--color-text-muted); margin-bottom:var(--space-xs);"></p>
            <div id="qh-list"></div>
            <button id="qh-load-more" class="btn btn-secondary" style="display:none; margin-top:var(--space-sm);">Load More</button>
          </div>
        </section>

        <!-- ===== QUESTION MANAGEMENT ===== -->
        <section class="admin-panel">
          <button class="admin-panel__head" data-panel="questions" aria-expanded="false" aria-controls="panel-questions">
            <span class="admin-panel__title">Question Bank</span>
            <span class="admin-panel__count" data-count="questions">·</span>
            <span class="admin-panel__chev" aria-hidden="true">▾</span>
          </button>
          <div class="admin-panel__body" id="panel-questions" hidden>
            <div class="admin-filters">
              <input id="q-search" class="input" placeholder="Search question text..." style="flex:2;">
              <select id="q-category" class="input" style="flex:1;">
                <option value="">All Categories</option>
                <option value="history">History</option>
                <option value="science">Science</option>
                <option value="nature">Nature</option>
                <option value="arts-literature">Arts &amp; Lit</option>
                <option value="culture-society">Culture</option>
                <option value="pop-culture">Pop Culture</option>
                <option value="world-geography">Geography</option>
                <option value="technology">Technology</option>
                <option value="sports">Sports</option>
                <option value="food">Food</option>
                <option value="logic">Logic</option>
                <option value="wild-card">Wild Card</option>
              </select>
              <select id="q-format" class="input" style="flex:1;">
                <option value="">All Formats</option>
                <option value="open">Open</option>
                <option value="removed">Removed</option>
              </select>
              <button id="btn-search-questions" class="btn btn-primary">Search</button>
            </div>
            <!-- Runs the same rules as the CI probe, in the browser, so the
                 list of answer keys worth a look is on the phone that can edit
                 them rather than in a workflow log. -->
            <button id="btn-review-answers" class="btn btn-secondary btn-block" style="margin-bottom:var(--space-sm);">Review answer keys</button>
            <p id="q-review-summary" class="admin-review__summary"></p>
            <div id="question-results"></div>
            <button id="btn-load-more" class="btn btn-secondary" style="display:none; margin-top:var(--space-sm);">Load More</button>
          </div>
        </section>

        <!-- ===== RECENT GAMES ===== -->
        <section class="admin-panel">
          <button class="admin-panel__head" data-panel="games" aria-expanded="false" aria-controls="panel-games">
            <span class="admin-panel__title">Recent Games</span>
            <span class="admin-panel__count" data-count="games">·</span>
            <span class="admin-panel__chev" aria-hidden="true">▾</span>
          </button>
          <div class="admin-panel__body" id="panel-games" hidden>
            <div id="recent-games"></div>
            <button id="btn-load-more-games" class="btn btn-secondary" style="display:none; margin-top:var(--space-sm);">Load More</button>
          </div>
        </section>

        <!-- ===== ERROR LOGS ===== -->
        <section class="admin-panel">
          <button class="admin-panel__head" data-panel="errors" aria-expanded="false" aria-controls="panel-errors">
            <span class="admin-panel__title">Error Logs</span>
            <span class="admin-panel__count" data-count="errors">·</span>
            <span class="admin-panel__chev" aria-hidden="true">▾</span>
          </button>
          <div class="admin-panel__body" id="panel-errors" hidden>
            <div style="display:flex; gap:var(--space-sm); margin-bottom:var(--space-sm);">
              <select id="error-severity" class="input" style="flex:1;">
                <option value="">All Types</option>
                <option value="onerror">onerror</option>
                <option value="unhandledrejection">unhandledrejection</option>
              </select>
              <button id="btn-clear-old-errors" class="btn btn-secondary">Clear 7d+</button>
            </div>
            <div id="error-logs"></div>
            <button id="btn-load-more-errors" class="btn btn-secondary" style="display:none; margin-top:var(--space-sm);">Load More</button>
          </div>
        </section>

        <!-- ===== CHAT ARCHIVE ===== -->
        <section class="admin-panel">
          <button class="admin-panel__head" data-panel="chat" aria-expanded="false" aria-controls="panel-chat">
            <span class="admin-panel__title">Chat Archive</span>
            <span class="admin-panel__count" data-count="chat">·</span>
            <span class="admin-panel__chev" aria-hidden="true">▾</span>
          </button>
          <div class="admin-panel__body" id="panel-chat" hidden>
            <div id="chat-archive"></div>
            <button id="btn-load-more-chats" class="btn btn-secondary" style="display:none; margin-top:var(--space-sm);">Load More</button>
          </div>
        </section>

        <!-- ===== ANNOUNCEMENTS ===== -->
        <section class="admin-panel">
          <button class="admin-panel__head" data-panel="announcement" aria-expanded="false" aria-controls="panel-announcement">
            <span class="admin-panel__title">Announcement</span>
            <span class="admin-panel__count" data-count="announcement">·</span>
            <span class="admin-panel__chev" aria-hidden="true">▾</span>
          </button>
          <div class="admin-panel__body" id="panel-announcement" hidden>
            <div style="display:flex; gap:var(--space-sm);">
              <input id="announcement-input" class="input" placeholder="Banner message for all users..." style="flex:1;">
              <button id="btn-set-announcement" class="btn btn-primary">Set</button>
              <button id="btn-clear-announcement" class="btn btn-secondary">Clear</button>
            </div>
            <p id="announcement-status" style="font-size:var(--text-xs); color:var(--color-text-muted); margin-top:var(--space-xs);"></p>
          </div>
        </section>

        <!-- ===== FEATURE FLAGS ===== -->
        <section class="admin-panel">
          <button class="admin-panel__head" data-panel="flags" aria-expanded="false" aria-controls="panel-flags">
            <span class="admin-panel__title">Feature Flags</span>
            <span class="admin-panel__count" data-count="flags">·</span>
            <span class="admin-panel__chev" aria-hidden="true">▾</span>
          </button>
          <div class="admin-panel__body" id="panel-flags" hidden>
            <div id="feature-flags"></div>
          </div>
        </section>

      </div>

    </div>
  </div>

  <!-- Display Name Modal -->
  <div id="display-name-modal" class="modal-overlay">
    <div class="modal">
      <h2 class="modal__title">Who Goes There?</h2>
      <input type="text" id="display-name-input" class="input" placeholder="Enter your name" aria-label="Display name" maxlength="20" autocomplete="off" spellcheck="false">
      <p id="display-name-error" style="color: var(--color-danger); font-size: var(--text-sm); margin-top: var(--space-sm); min-height: 1.2em;"></p>
      <button class="btn btn-primary btn-block" id="display-name-submit" style="margin-top: var(--space-lg);">Continue</button>
    </div>
  </div>

  <script type="module" src="js/admin.js?v=20260824g"></script>

</body>
</html>
