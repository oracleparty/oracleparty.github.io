<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#F8F7F4">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Oracle Party — Leaderboards</title>
  <script>(function(){var s=localStorage.getItem('oracle_party_theme');if(!s){s=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';localStorage.setItem('oracle_party_theme',s);}if(s!=='light'){document.documentElement.setAttribute('data-theme',s);var m={'dark':'#1A1A2E','oled':'#000000'};document.querySelector('meta[name="theme-color"]').content=m[s]||'#F8F7F4';}})();if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;0,9..144,900;1,9..144,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
  <link rel="stylesheet" href="css/style.css?v=20260411c">
</head>
<body style="opacity:0">

  <div class="screen screen--scrollable active" style="display: flex; flex-direction: column;">

    <div class="page-header">
      <button class="page-header__back" id="btn-back">&larr;</button>
      <h1 class="page-header__title">Leaderboards</h1>
      <button class="theme-toggle" aria-label="Toggle theme">&#x1F319;</button>
    </div>

    <!-- Tabs -->
    <div class="profile-tabs" role="tablist" aria-label="Leaderboard views">
      <button class="profile-tab active" data-tab="global" role="tab" aria-selected="true" aria-controls="tab-global">Global</button>
      <button class="profile-tab" data-tab="weekly" role="tab" aria-selected="false" aria-controls="tab-weekly">Weekly</button>
      <button class="profile-tab" data-tab="category" role="tab" aria-selected="false" aria-controls="tab-category">Category</button>
      <button class="profile-tab" data-tab="friends" role="tab" aria-selected="false" aria-controls="tab-friends">Friends</button>
    </div>

    <!-- Global -->
    <div id="tab-global" class="leaderboard-tab" role="tabpanel" aria-labelledby="tab-global">
      <div id="lb-global-list" class="leaderboard-list">
        <p class="leaderboard-loading">Loading...</p>
      </div>
    </div>

    <!-- Weekly -->
    <div id="tab-weekly" class="leaderboard-tab" role="tabpanel" aria-labelledby="tab-weekly" style="display:none;">
      <p class="leaderboard-reset-note" id="weekly-reset-note"></p>
      <div id="lb-weekly-list" class="leaderboard-list">
        <p class="leaderboard-loading">Loading...</p>
      </div>
    </div>

    <!-- Category -->
    <div id="tab-category" class="leaderboard-tab" role="tabpanel" aria-labelledby="tab-category" style="display:none;">
      <div style="display: flex; gap: var(--space-xs); margin: var(--space-sm) var(--space-lg);">
        <select id="lb-category-select" class="input" style="flex: 1;">
          <option value="history">History</option>
          <option value="science">Science</option>
          <option value="nature">Nature</option>
          <option value="arts-literature">Arts & Lit</option>
          <option value="culture-society">Culture</option>
          <option value="pop-culture">Pop Culture</option>
          <option value="world-geography">Geography</option>
          <option value="technology">Technology</option>
          <option value="sports">Sports</option>
          <option value="food">Food</option>
          <option value="logic">Logic</option>
          <option value="wild-card">Wild Card</option>
        </select>
        <select id="lb-subcategory-select" class="input" style="flex: 1; display: none;"></select>
      </div>
      <div id="lb-category-list" class="leaderboard-list">
        <p class="leaderboard-loading">Loading...</p>
      </div>
    </div>

    <!-- Friends -->
    <div id="tab-friends" class="leaderboard-tab" role="tabpanel" aria-labelledby="tab-friends" style="display:none;">
      <div id="lb-friends-list" class="leaderboard-list">
        <p class="leaderboard-loading">Loading...</p>
      </div>
    </div>

  </div>

  <!-- Display Name Modal -->
  <div id="display-name-modal" class="modal-overlay">
    <div class="modal">
      <h2 class="modal__title">Who Goes There?</h2>
      <input type="text" id="display-name-input" class="input" placeholder="Enter your name" aria-label="Display name" maxlength="20" autocomplete="off" spellcheck="false">
      <p id="display-name-error" style="color: var(--color-danger); font-size: var(--text-sm); margin-top: var(--space-sm); min-height: 1.2em;"></p>
      <button class="btn btn-primary btn-block" id="display-name-submit" style="margin-top: var(--space-lg);">Continue</button>
    </div>
  </div>

  <script type="module" src="js/leaderboard.js?v=20260404"></script>

</body>
</html>
