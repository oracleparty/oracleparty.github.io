<!DOCTYPE html>
<html data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1A1A2E">
<title>Watermark Test — All 12 Categories</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { margin: 0; padding: 8px; background: var(--color-bg); }
  .test-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 16px; }
  .test-grid-2col { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-md); }
  .category-card { min-height: 80px; }
  .test-grid .category-card { padding: 14px 6px 10px !important; }
  .test-grid .category-card__name { font-size: 9px !important; }
  h1 { font-size: 13px; text-align: center; color: var(--color-primary); margin: 8px 0; font-family: var(--font-heading); }
  h2 { font-size: 11px; text-align: center; color: var(--color-text-dim); margin: 4px 0 8px; font-family: var(--font-heading); }
</style>
</head>
<body>
<h1>All 12 Watermarks</h1>
<div class="test-grid">
  <button class="category-card" data-hiero="𓋹"><div class="category-card__icon-wrap"><span class="category-card__icon">⏳</span></div><div class="category-card__name">History</div></button>
  <button class="category-card" data-hiero="𓂀"><div class="category-card__icon-wrap"><span class="category-card__icon">⚗️</span></div><div class="category-card__name">Science</div></button>
  <button class="category-card" data-hiero="𓅃"><div class="category-card__icon-wrap"><span class="category-card__icon">🌿</span></div><div class="category-card__name">Nature</div></button>
  <button class="category-card" data-hiero="𓅝"><div class="category-card__icon-wrap"><span class="category-card__icon">📜</span></div><div class="category-card__name">Arts & Lit</div></button>
  <button class="category-card" data-hiero="𓀭"><div class="category-card__icon-wrap"><span class="category-card__icon">🏛️</span></div><div class="category-card__name">Culture</div></button>
  <button class="category-card" data-hiero="𓇼"><div class="category-card__icon-wrap"><span class="category-card__icon">🎬</span></div><div class="category-card__name">Pop Culture</div></button>
  <button class="category-card" data-hiero="𓈉"><div class="category-card__icon-wrap"><span class="category-card__icon">🌍</span></div><div class="category-card__name">Geography</div></button>
  <button class="category-card" data-hiero="𓊝"><div class="category-card__icon-wrap"><span class="category-card__icon">💻</span></div><div class="category-card__name">Technology</div></button>
  <button class="category-card" data-hiero="𓃗"><div class="category-card__icon-wrap"><span class="category-card__icon">⚽</span></div><div class="category-card__name">Sports</div></button>
  <button class="category-card" data-hiero="𓎿"><div class="category-card__icon-wrap"><span class="category-card__icon">🍕</span></div><div class="category-card__name">Food</div></button>
  <button class="category-card" data-hiero="𓃻"><div class="category-card__icon-wrap"><span class="category-card__icon">🧩</span></div><div class="category-card__name">Logic</div></button>
  <button class="category-card" data-hiero="𓆣"><div class="category-card__icon-wrap"><span class="category-card__icon">🃏</span></div><div class="category-card__name">Wild Card</div></button>
</div>
<h2>2-Column (Actual Size)</h2>
<div class="test-grid-2col">
  <button class="category-card" data-hiero="𓋹"><div class="category-card__icon-wrap"><span class="category-card__icon">⏳</span></div><div class="category-card__name">History</div><div class="category-card__count">287 Qs</div></button>
  <button class="category-card" data-hiero="𓂀"><div class="category-card__icon-wrap"><span class="category-card__icon">⚗️</span></div><div class="category-card__name">Science</div><div class="category-card__count">195 Qs</div></button>
  <button class="category-card" data-hiero="𓅃"><div class="category-card__icon-wrap"><span class="category-card__icon">🌿</span></div><div class="category-card__name">Nature</div><div class="category-card__count">142 Qs</div></button>
  <button class="category-card" data-hiero="𓅝"><div class="category-card__icon-wrap"><span class="category-card__icon">📜</span></div><div class="category-card__name">Arts & Literature</div><div class="category-card__count">168 Qs</div></button>
  <button class="category-card" data-hiero="𓀭"><div class="category-card__icon-wrap"><span class="category-card__icon">🏛️</span></div><div class="category-card__name">Culture & Society</div><div class="category-card__count">124 Qs</div></button>
  <button class="category-card" data-hiero="𓇼"><div class="category-card__icon-wrap"><span class="category-card__icon">🎬</span></div><div class="category-card__name">Pop Culture</div><div class="category-card__count">156 Qs</div></button>
  <button class="category-card" data-hiero="𓈉"><div class="category-card__icon-wrap"><span class="category-card__icon">🌍</span></div><div class="category-card__name">World Geography</div><div class="category-card__count">132 Qs</div></button>
  <button class="category-card" data-hiero="𓊝"><div class="category-card__icon-wrap"><span class="category-card__icon">💻</span></div><div class="category-card__name">Technology</div><div class="category-card__count">98 Qs</div></button>
  <button class="category-card" data-hiero="𓃗"><div class="category-card__icon-wrap"><span class="category-card__icon">⚽</span></div><div class="category-card__name">Sports</div><div class="category-card__count">110 Qs</div></button>
  <button class="category-card" data-hiero="𓎿"><div class="category-card__icon-wrap"><span class="category-card__icon">🍕</span></div><div class="category-card__name">Food & Drink</div><div class="category-card__count">87 Qs</div></button>
  <button class="category-card" data-hiero="𓃻"><div class="category-card__icon-wrap"><span class="category-card__icon">🧩</span></div><div class="category-card__name">Logic</div><div class="category-card__count">64 Qs</div></button>
  <button class="category-card" data-hiero="𓆣"><div class="category-card__icon-wrap"><span class="category-card__icon">🃏</span></div><div class="category-card__name">Wild Card</div><div class="category-card__count">169 Qs</div></button>
</div>
</body>
</html>
